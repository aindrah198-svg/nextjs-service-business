name: Next.js checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/forma.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3004 >/dev/null && break; sleep 1; done
          npm run test:browser
